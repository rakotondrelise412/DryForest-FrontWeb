<header class="dashboard-header">
  <div class="header-left">
    <button class="sidebar-toggle" (click)="toggleSidebar()" aria-label="Basculer la barre latérale">
      <span class="material-icons menu-icon" aria-hidden="true">menu</span>
    </button>

     <div class="title-block">
      <div class="title-text">
        <h1>Dry Forest</h1>
        <p class="subtitle">Suivi des Pépinières et Reforestation</p>
      </div>
    </div>
  </div>

  @if (currentUser) {
    <div class="header-right">
      <div class="user-info">
        <!-- Avatar -->
        <div class="user-avatar">
          {{ currentUser.first_name.charAt(0) }}{{ currentUser.last_name.charAt(0) }}
        </div>

        <div class="user-details">
          <span class="user-name">
            {{ currentUser.first_name }}
            {{ currentUser.last_name }}
          </span>

          <span class="user-role">
            {{ currentUser.role?.name }}
          </span>

          <span class="user-email">
            {{ currentUser.email }}
          </span>
        </div>
      </div>

      <button class="logout-btn" (click)="logout()" aria-label="Déconnexion">
        <span class="material-icons" aria-hidden="true">logout</span>
      </button>
    </div>
  }
</header>
